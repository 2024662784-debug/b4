<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Solar Panel Model</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .instruction {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(90%, 420px);
            box-sizing: border-box;
            padding: 12px 14px;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            border-radius: 8px;
            text-align: center;
            z-index: 10;
            line-height: 1.4;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="instruction">
        Allow camera access, then point the camera at the Hiro marker.
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true; logarithmicDepthBuffer: true"
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false">

        <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.5" position="1 3 2"></a-light>

        <a-marker preset="hiro">
            <!-- Keep the model steady so it is easier to view in AR. -->
            <a-entity position="0 0 0" scale="0.8 0.8 0.8">

                <!-- Base -->
                <a-box
                    position="0 0.05 0"
                    width="2.4" height="0.1" depth="1.5"
                    color="#555555">
                </a-box>

                <!-- Support posts -->
                <a-box
                    position="-0.7 0.58 0"
                    width="0.12" height="1.05" depth="0.12"
                    color="#B0B0B0">
                </a-box>
                <a-box
                    position="0.7 0.58 0"
                    width="0.12" height="1.05" depth="0.12"
                    color="#B0B0B0">
                </a-box>

                <!-- Panel assembly: all parts share the same tilt and local coordinates. -->
                <a-entity position="0 1.18 0" rotation="-25 0 0">

                    <!-- Dark panel backing/frame -->
                    <a-box
                        position="0 0 0"
                        width="2.2" height="0.08" depth="1.3"
                        color="#202020">
                    </a-box>

                    <!-- Blue panel surface sits just above the backing -->
                    <a-box
                        position="0 0.051 0"
                        width="2.05" height="0.025" depth="1.15"
                        color="#145DA0"
                        material="metalness: 0.2; roughness: 0.5">
                    </a-box>

                    <!-- Vertical cell separators -->
                    <a-box position="-0.51 0.067 0" width="0.018" height="0.008" depth="1.12" color="#FFFFFF"></a-box>
                    <a-box position="0 0.067 0" width="0.018" height="0.008" depth="1.12" color="#FFFFFF"></a-box>
                    <a-box position="0.51 0.067 0" width="0.018" height="0.008" depth="1.12" color="#FFFFFF"></a-box>

                    <!-- Horizontal cell separators -->
                    <a-box position="0 0.067 -0.28" width="2.02" height="0.008" depth="0.018" color="#FFFFFF"></a-box>
                    <a-box position="0 0.067 0" width="2.02" height="0.008" depth="0.018" color="#FFFFFF"></a-box>
                    <a-box position="0 0.067 0.28" width="2.02" height="0.008" depth="0.018" color="#FFFFFF"></a-box>
                </a-entity>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
